volumes:
  frontend_dist:
  users_data:

services:
  backend:
    build: ./backend
    container_name: backend
    expose:
      - "5000"
    volumes:
      #- users_data:/app/instance
      - ./backend/yolo_model.pt:/app/yolo_model.pt
    env_file:
      - ./backend/.env.prod
    environment:
      - FLASK_ENV=production
    entrypoint: ["bash", "/app/entrypoint.sh"]
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - frontend_dist:/app/dist
    # При старте: билдим и копируем в /app/dist, затем "спим", чтобы контейнер не упал
    command: >
      sh -c "
        npm ci &&
        npm run build &&
        rm -rf /app/dist/* &&
        cp -r build/. /app/dist/
      "
    healthcheck:
      test: [ "CMD", "test", "-f", "/app/dist/index.html" ]
      interval: 10s
      retries: 5
    # флашим логи сразу, нет рестартов
    restart: "no"

  telegram_bot:
    build: ./telegram_bot
    container_name: telegram_bot
    environment:
      - PYTHONUNBUFFERED=1
      - BOT_ENV=production
    volumes:
      - ./telegram_bot:/app
      - /tmp:/tmp
    env_file:
      - ./telegram_bot/.env.prod
    entrypoint: ["bash", "/app/entrypoint.sh"]
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
    depends_on:
      frontend:
        condition: service_healthy
    restart: always

