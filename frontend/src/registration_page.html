<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация | ТомITик</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(#d8e3a8, #aac46b);
      color: #333;
      text-align: center;
    }
    header {
      background-color: #a3bc67;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      color: white;
      font-weight: 300;
    }
    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-size: 0.9rem;
    }
    .form-container {
      margin: 100px auto;
      padding: 40px;
      background-color: rgba(255, 255, 255, 0.9);
      max-width: 400px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .form-container h2 {
      margin-bottom: 20px;
      color: #4b2e2e;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    .form-container button {
      margin-top: 20px;
      padding: 10px 30px;
      border-radius: 30px;
      background-color: #a3bc67;
      border: 2px solid white;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .footer {
      background-color: white;
      padding: 40px 20px 60px;
    }
    .footer h3 {
      font-size: 1.3rem;
      margin-bottom: 10px;
    }
    .footer p {
      margin: 5px;
    }
    .bottom-bar {
      background-color: #000;
      color: white;
      padding: 10px;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>ТомITик</h1>
    <nav>
      <a href="index.html">Главная</a>
      <a href="#">О системе</a>
      <a href="#">Контакты</a>
    </nav>
  </header>

  <div class="form-container">
    <h2>Регистрация</h2>
    <form onsubmit="return register(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required />
      </div>
      <div class="form-group">
        <label for="confirm">Подтверждение пароля</label>
        <input type="password" id="confirm" name="confirm" required />
      </div>
      <button type="submit">Зарегистрироваться</button>
    </form>
  </div>

  <footer class="footer">
    <h3>Наши контакты</h3>
    <p>+7(996)697-92-36</p>
    <p>tomITik@gmail.com</p>
  </footer>

  <div class="bottom-bar">
    Made on Tilda
  </div>

  <script>
    function validatePassword(password) {
      const re = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/;
      return re.test(password);
    }

    async function register(event) {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        alert("Пароли не совпадают!");
        return false;
      }

      if (!validatePassword(password)) {
        alert("Пароль должен содержать хотя бы одну цифру, одну заглавную и строчную букву и быть длиной от 8 символов.");
        return false;
      }

      try {
        const response = await fetch("http://127.0.0.1:8000/api/register/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        if (response.ok) {
          alert("Регистрация прошла успешно. Теперь вы можете войти.");
          window.location.href = "login.html";
        } else {
          const data = await response.json();
          alert("Ошибка регистрации: " + (data.detail || JSON.stringify(data)));
        }
      } catch (err) {
        alert("Ошибка запроса: " + err.message);
      }
      return false;
    }
  </script>
</body>
</html>
