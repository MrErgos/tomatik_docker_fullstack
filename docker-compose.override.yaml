services:
  backend:
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    env_file:
      - ./backend/.env.dev
    volumes:
      - ./backend:/app

  frontend:
    command: npm start
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true

  telegram_bot:
    env_file:
      - ./telegram_bot/.env.dev
    environment:
      - BOT_ENV=development
    volumes:
      - ./telegram_bot:/app
    command: ["bash", "entrypoint.sh"]

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev_nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
